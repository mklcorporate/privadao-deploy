<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mayckon | Links</title>
  <meta name="description" content="Todos os links do Mayckon em um só lugar.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Mayckon | Links">
  <meta property="og:description" content="Todos os links do Mayckon em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/IMG_8612.JPG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f5fa;
      --foreground: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #7dd3fc 100%);
      --shadow-button: 0 4px 14px rgba(59, 130, 246, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HERO - foto como capa inteira */
    .hero {
      position: relative;
      width: 100%;
      height: 72vh;
      min-height: 420px;
      max-height: 600px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: linear-gradient(to top, var(--bg) 0%, rgba(240, 245, 250, 0.85) 30%, rgba(240, 245, 250, 0) 100%);
      pointer-events: none;
    }

    /* PROFILE INFO - sobrepondo o degradê */
    .profile {
      position: relative;
      z-index: 2;
      margin-top: -6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.25rem;
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--foreground);
      text-align: center;
      letter-spacing: -0.02em;
    }

    .profile-handle {
      font-size: 0.9375rem;
      color: var(--muted);
      margin-top: 0.25rem;
      text-align: center;
    }

    /* LINKS */
    .links {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.0625rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.0625rem;
      transition: all 0.2s;
      color: #fff;
      position: relative;
    }

    .link-btn:active { transform: scale(0.97); }

    .link-btn svg {
      width: 1.25rem;
      height: 1.25rem;
      margin-right: 0.625rem;
      flex-shrink: 0;
    }

    /* CLUB */
    .link-club {
      background: var(--accent-gradient);
      box-shadow: var(--shadow-button);
    }

    .link-club:hover {
      opacity: 0.92;
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    /* PRIVACY */
    .link-privacy {
      background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
    }

    .link-privacy:hover {
      opacity: 0.92;
      box-shadow: 0 6px 24px rgba(249, 115, 22, 0.4);
      transform: translateY(-1px);
    }

    /* TIKTOK */
    .link-tiktok {
      background: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .link-tiktok:hover {
      background: #111;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 0 1rem 2rem;
      color: var(--muted);
      font-size: 0.75rem;
      opacity: 0.4;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile { animation: fadeUp 0.5s ease 0.1s both; }
    .links .link-btn:nth-child(1) { animation: fadeUp 0.4s ease 0.2s both; }
    .links .link-btn:nth-child(2) { animation: fadeUp 0.4s ease 0.3s both; }
    .links .link-btn:nth-child(3) { animation: fadeUp 0.4s ease 0.4s both; }

    @media (min-width: 768px) {
      .hero { height: 65vh; max-height: 560px; }
      .profile-name { font-size: 2rem; }
      .links { max-width: 30rem; }
    }

    @media (min-width: 1024px) {
      .hero { max-height: 620px; }
      .profile-name { font-size: 2.125rem; }
      .links { max-width: 32rem; }
    }

    @media (max-height: 700px) {
      .hero { height: 55vh; min-height: 300px; }
      .profile { margin-top: -4rem; }
    }
  </style>
</head>
<body>

<!-- HERO: foto como capa com degradê -->
<div class="hero">
  <img src="/images/IMG_8612.JPG" alt="Mayckon">
  <div class="hero-gradient"></div>
</div>

<!-- PROFILE -->
<div class="profile">
  <h1 class="profile-name">Mayckon</h1>
  <p class="profile-handle">@mayckonkrik</p>
</div>

<!-- LINKS -->
<div class="links">

  <!-- MEU CLUB (desativado temporariamente)
  <a href="/vendas" class="link-btn link-club">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Meu Club
  </a>
  -->

  <a href="https://privacy.com.br/@bryanhoffman" class="link-btn link-privacy" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Privacy
  </a>

  <a href="https://www.tiktok.com/@mayckon.krik" class="link-btn link-tiktok" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.81a8.23 8.23 0 0 0 4.76 1.5V6.86a4.83 4.83 0 0 1-1-.17z"/></svg>
    TikTok
  </a>

</div>

<div class="footer">insideclub.com.br</div>

</body>
</html>
