<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mayckon | Links</title>
  <meta name="description" content="Todos os links do Mayckon em um só lugar.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Mayckon | Links">
  <meta property="og:description" content="Todos os links do Mayckon em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/IMG_8612.JPG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-start: #0f0c29;
      --bg-mid: #302b63;
      --bg-end: #24243e;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 600px at 20% 20%, rgba(167, 139, 250, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 80% 80%, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 3rem 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* AVATAR */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .avatar-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8, #a78bfa);
      background-size: 200% 200%;
      animation: ringShift 4s ease infinite;
    }

    @keyframes ringShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      border: 3px solid var(--bg-start);
      display: block;
    }

    .avatar-status {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid var(--bg-start);
    }

    /* NAME */
    .profile-name {
      font-size: 1.625rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .profile-handle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-align: center;
    }

    /* LINKS */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-icon {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 1.375rem;
      height: 1.375rem;
    }

    .link-text {
      flex: 1;
    }

    .link-text span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 0.125rem;
    }

    .link-arrow {
      color: var(--text-muted);
      transition: transform 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .link-arrow svg {
      width: 1.125rem;
      height: 1.125rem;
    }

    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      color: var(--text);
    }

    /* CLUB BUTTON - destaque */
    .link-club .link-icon {
      background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
      color: #fff;
    }

    .link-club:hover {
      border-color: rgba(167, 139, 250, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px var(--accent-glow);
    }

    .link-club::before {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.08), rgba(124, 58, 237, 0.04));
    }

    .link-club:hover::before { opacity: 1; }

    /* TIKTOK BUTTON */
    .link-tiktok .link-icon {
      background: linear-gradient(135deg, #000 0%, #25f4ee 50%, #fe2c55 100%);
      background-size: 200% 200%;
      color: #fff;
      animation: tiktokShift 3s ease infinite;
    }

    @keyframes tiktokShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .link-tiktok:hover {
      border-color: rgba(37, 244, 238, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(37, 244, 238, 0.15);
    }

    .link-tiktok::before {
      background: linear-gradient(135deg, rgba(37, 244, 238, 0.06), rgba(254, 44, 85, 0.04));
    }

    .link-tiktok:hover::before { opacity: 1; }

    /* FOOTER */
    .footer {
      margin-top: auto;
      padding: 2.5rem 0 1.5rem;
      text-align: center;
      color: rgba(148, 163, 184, 0.4);
      font-size: 0.75rem;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper { animation: fadeUp 0.6s ease both; }
    .profile-name { animation: fadeUp 0.6s ease 0.1s both; }
    .profile-handle { animation: fadeUp 0.6s ease 0.15s both; }
    .link-btn:nth-child(1) { animation: fadeUp 0.5s ease 0.25s both; }
    .link-btn:nth-child(2) { animation: fadeUp 0.5s ease 0.35s both; }
    .link-btn:nth-child(3) { animation: fadeUp 0.5s ease 0.45s both; }
    .link-btn:nth-child(4) { animation: fadeUp 0.5s ease 0.55s both; }

    @media (min-width: 768px) {
      .container { padding-top: 4rem; }
      .profile-name { font-size: 1.875rem; }
    }

    @media (hover: none) {
      .link-btn:hover { transform: none; box-shadow: none; }
      .link-btn:active { transform: scale(0.97); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- AVATAR -->
  <div class="avatar-wrapper">
    <div class="avatar-ring">
      <img src="/images/IMG_8612.JPG" alt="Mayckon" id="avatarImg">
    </div>
    <div class="avatar-status"></div>
  </div>

  <!-- NAME -->
  <h1 class="profile-name">Mayckon</h1>
  <p class="profile-handle">@mayckonkrik</p>

  <!-- LINKS -->
  <div class="links">

    <!-- MEU CLUB -->
    <a href="/vendas" class="link-btn link-club">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div class="link-text">
        Meu Club
        <span>Conteúdo exclusivo para membros</span>
      </div>
      <div class="link-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <!-- TIKTOK -->
    <a href="https://www.tiktok.com/@mayckon.krik" class="link-btn link-tiktok" target="_blank" rel="noopener noreferrer">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.81a8.23 8.23 0 0 0 4.76 1.5V6.86a4.83 4.83 0 0 1-1-.17z"/></svg>
      </div>
      <div class="link-text">
        TikTok
        <span>@mayckon.krik</span>
      </div>
      <div class="link-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

  </div>

  <div class="footer">insideclub.com.br</div>

</div>

</body>
</html>
