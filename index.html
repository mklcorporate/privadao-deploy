<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mayckon | Links</title>
  <meta name="description" content="Todos os links do Mayckon em um só lugar.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Mayckon | Links">
  <meta property="og:description" content="Todos os links do Mayckon em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/IMG_8612.JPG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f5fa;
      --card: #ffffff;
      --foreground: #1e293b;
      --muted: #64748b;
      --border: #d6e3f0;
      --accent: #3b82f6;
      --accent-light: #93c5fd;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #7dd3fc 100%);
      --shadow-card: 0 2px 16px rgba(59, 130, 246, 0.08);
      --shadow-button: 0 4px 14px rgba(59, 130, 246, 0.3);
      --radius: 1rem;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 28rem;
      padding: 2rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* CARD PRINCIPAL */
    .profile-card {
      width: 100%;
      background: var(--card);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }

    /* COVER */
    .cover {
      position: relative;
      height: 10rem;
      background: var(--accent-gradient);
      overflow: hidden;
    }

    .cover::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.15), transparent);
    }

    /* AVATAR */
    .avatar-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -3.5rem;
      position: relative;
      z-index: 2;
      padding: 0 1.5rem;
    }

    .avatar {
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      border: 4px solid var(--card);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--foreground);
      margin-top: 0.875rem;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .profile-handle {
      font-size: 0.9375rem;
      color: var(--muted);
      margin-top: 0.125rem;
      text-align: center;
    }

    .profile-verified {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.625rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.08);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .profile-verified svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    /* LINKS */
    .links-area {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    .link-btn:active { transform: scale(0.98); }

    /* CLUB */
    .link-club {
      background: var(--accent-gradient);
      box-shadow: var(--shadow-button);
    }

    .link-club:hover {
      opacity: 0.93;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    /* TIKTOK */
    .link-tiktok {
      background: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .link-tiktok:hover {
      background: #1a1a1a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .link-icon-area {
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 50%;
      margin: 0.25rem;
    }

    .link-club .link-icon-area {
      background: rgba(255, 255, 255, 0.2);
    }

    .link-tiktok .link-icon-area {
      background: rgba(255, 255, 255, 0.1);
    }

    .link-icon-area svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .link-label {
      flex: 1;
      text-align: center;
      padding-right: 3.75rem;
    }

    /* FOOTER */
    .footer {
      margin-top: auto;
      padding: 2rem 0 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      opacity: 0.5;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .links-area .link-btn:nth-child(1) { animation: fadeUp 0.4s ease 0.15s both; }
    .links-area .link-btn:nth-child(2) { animation: fadeUp 0.4s ease 0.25s both; }
    .links-area .link-btn:nth-child(3) { animation: fadeUp 0.4s ease 0.35s both; }

    @media (min-width: 768px) {
      .container { padding-top: 3rem; max-width: 30rem; }
      .cover { height: 11rem; }
      .avatar { width: 7.5rem; height: 7.5rem; }
      .profile-name { font-size: 1.625rem; }
    }

    @media (min-width: 1024px) {
      .container { max-width: 32rem; padding-top: 4rem; }
      .cover { height: 12rem; border-radius: 1.5rem 1.5rem 0 0; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="profile-card">

    <!-- COVER -->
    <div class="cover"></div>

    <!-- AVATAR + INFO -->
    <div class="avatar-area">
      <div class="avatar">
        <img src="/images/IMG_8612.JPG" alt="Mayckon">
      </div>
      <h1 class="profile-name">Mayckon</h1>
      <p class="profile-handle">@mayckonkrik</p>
      <div class="profile-verified">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Verificado
      </div>
    </div>

    <!-- LINKS -->
    <div class="links-area">

      <a href="/vendas" class="link-btn link-club">
        <div class="link-icon-area">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <div class="link-label">Meu Club</div>
      </a>

      <a href="https://www.tiktok.com/@mayckon.krik" class="link-btn link-tiktok" target="_blank" rel="noopener noreferrer">
        <div class="link-icon-area">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.81a8.23 8.23 0 0 0 4.76 1.5V6.86a4.83 4.83 0 0 1-1-.17z"/></svg>
        </div>
        <div class="link-label">TikTok</div>
      </a>

    </div>

  </div>

  <div class="footer">insideclub.com.br</div>

</div>

</body>
</html>
